name: DHRMS CI

on:
  pull_request:
  push:
    branches: [main, nestjs-migration, flow-overhaul]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dhrms-backend-nestjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dhrms-backend-nestjs/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dhrms_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dhrms_frontend/package-lock.json
      - run: npm ci
      - run: npm run check:imports
      - run: npm run lint
      - run: npm run build
