# ===============================
# APPLICATION
# ===============================

spring.application.name=dhrms-backend


# ===============================
# SERVER
# ===============================

server.port=8080


# ===============================
# POSTGRESQL
# ===============================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dhrms}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ===============================
# SWAGGER / OPENAPI
# ===============================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# ===============================
# FILE STORAGE & MULTIPART
# ===============================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.storage.type=local
app.storage.base-directory=uploads/medical-documents
app.storage.max-file-size=10485760

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000